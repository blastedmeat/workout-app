<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Lift</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#141a23; --panel2:#1d252f; --line:#2b3542;
    --txt:#eef2f6; --dim:#8f9bab; --acc:#ff7a45; --acc2:#e8632c;
    --good:#3fb950; --bad:#f85149; --info:#58a6ff;
    --tap:52px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  h1{font-size:22px;margin:0 0 2px;letter-spacing:-.02em}
  h2{font-size:18px;margin:0 0 8px}
  h3{font-size:15px;margin:0 0 6px}
  .wrap{max-width:620px;margin:0 auto;padding:14px}
  .muted{color:var(--dim)} .tiny{font-size:13px} .mono{font-variant-numeric:tabular-nums}
  button{font:inherit;border:0;border-radius:12px;background:var(--panel2);color:var(--txt);
    padding:12px 16px;cursor:pointer;min-height:var(--tap)}
  button:active{transform:scale(.97)}
  button.primary{background:var(--acc);color:#1a0f08;font-weight:700}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
  button.sm{min-height:40px;padding:8px 12px;font-size:14px;border-radius:9px}
  input,select{font:inherit;background:#070b10;color:var(--txt);border:1px solid var(--line);
    border-radius:10px;padding:12px;width:100%;min-height:var(--tap)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .between{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}

  /* bottom nav */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
    background:rgba(10,14,20,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  .nav button{flex:1;background:transparent;color:var(--dim);font-size:12px;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;min-height:0}
  .nav button.on{color:var(--acc)}
  .nav .ic{font-size:20px;line-height:1}

  /* exercise block */
  .ex{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .ex.done{border-color:#1d4429}
  .ex-hd{padding:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ex-nm{font-weight:650;font-size:17px;letter-spacing:-.01em}
  .target{background:var(--panel2);border-radius:10px;padding:10px 12px;margin:0 14px 12px;
    display:flex;justify-content:space-between;align-items:center;gap:10px}
  .target b{font-size:19px;color:var(--acc)}
  .setrow{display:flex;gap:7px;align-items:center;padding:7px 14px}
  .setlbl{width:60px;font-size:13px;color:var(--dim);flex:none}
  .setrow input{padding:10px;text-align:center;font-size:17px;font-weight:600}
  .logged{padding:8px 14px 14px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--panel2);border-radius:8px;padding:5px 10px;font-size:13px;
    font-variant-numeric:tabular-nums}
  .chip.r{border-left:3px solid var(--acc)}
  .chip.l{border-left:3px solid var(--info)}
  .info{padding:0 14px 14px;font-size:14px;line-height:1.6;color:#cdd6e0;
    border-top:1px solid var(--line);margin-top:4px;padding-top:12px}
  .info b{color:var(--txt)}
  .info ul{margin:6px 0 0;padding-left:20px}
  .info li{margin-bottom:4px}
  .watch{display:inline-block;margin-top:10px;color:var(--info);text-decoration:none;
    border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;
    background:var(--panel2);color:var(--dim);font-weight:600;letter-spacing:.03em}
  .pill.uni{background:#2b1a10;color:var(--acc)}

  /* rest timer */
  .rest{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));
    z-index:40;background:var(--acc);color:#1a0f08;border-radius:14px;padding:12px 16px;
    display:flex;justify-content:space-between;align-items:center;font-weight:700;
    box-shadow:0 8px 28px rgba(0,0,0,.5)}
  .rest button{background:rgba(0,0,0,.18);color:#1a0f08;font-weight:700}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
  th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  td.num,th.num{text-align:right}
  .bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%;background:var(--acc)}
  .ok{background:#12261a;border:1px solid #1d4429;color:#56d364;padding:10px 12px;
    border-radius:10px;margin-bottom:10px;font-size:14px}
  .err{background:#341a1a;border:1px solid #5c2626;color:#ff9d95;padding:10px 12px;
    border-radius:10px;margin-bottom:10px;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="rest"></div>
<div class="nav" id="nav"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { initializeFirestore, doc, getDoc, setDoc, collection, onSnapshot,

/* ============================================================
   FIREBASE — new project, separate from the picks pool.
   ============================================================ */
const firebaseConfig = {
  apiKey:            "AIzaSyA7v3CtI3xIqAv5bIQGwrazWzJXxqbAXlE",
  authDomain:        "workout-app-1010e.firebaseapp.com",
  projectId:         "workout-app-1010e",

const fbApp = initializeApp(firebaseConfig);
const db = initializeFirestore(fbApp,{ experimentalForceLongPolling:true });
const SESSIONS = collection(db,"sessions");

const PASSCODE = "abc123";   // change this

/* ============================================================
   PROGRAM — static. Lives in code, not the database.
   uni: trained one side at a time. Right always leads.
   extraRight: extra set on the right (direct arm work only).
   ============================================================ */
const EX = {

    miss:"Rotating the torso to help the press. If you're twisting, the weight is too heavy.",
    vid:"one arm dumbbell bench press form" },

  orow:{ n:"One-Arm DB Row", uni:true, sets:3, lo:8, hi:12,
    setup:"One knee and one hand on the bench, back flat and roughly parallel to the floor. Dumbbell hanging straight down in the free hand.",

    miss:"Yanking with the lower back and turning it into a twist. Slow the lowering down to fix it.",

  pushup:{ n:"Push-Ups", uni:false, sets:2, lo:5, hi:30, bw:true,
    setup:"Hands slightly wider than shoulders, body in a straight line from head to heels.",
    focus:["Squeeze your glutes — it stops the hips sagging.","Elbows at about 45° from your body, not flared straight out.","Full range: chest close to the floor, full lockout at the top."],
    miss:"Hips sagging or head craning forward. If reps get ugly, stop the set.",
    vid:"proper push up form" },

  curl:{ n:"DB Curl", uni:true, sets:2, extraRight:true, lo:10, hi:15,
    setup:"Standing, one dumbbell, arm hanging at your side, palm forward.",
    focus:["Keep your elbow pinned at your side — it shouldn't drift forward.","Lower slowly, about three seconds. The lowering builds more than the lifting.","Full stretch at the bottom. Don't stop halfway down."],
    miss:"Swinging the weight up with the back. If your torso moves, go lighter.",
    vid:"dumbbell biceps curl form" },

  tri:{ n:"Overhead Triceps Extension", uni:false, sets:2, lo:10, hi:15,
    setup:"Seated or standing, both hands cupping one dumbbell, held overhead with arms straight.",
    focus:["Only your forearms move. Upper arms stay vertical next to your ears.","Lower until you feel a real stretch behind the arm.","Keep your ribs down — don't arch your lower back to get more range."],
    miss:"Elbows flaring out and drifting forward, turning it into a press.",
    vid:"dumbbell overhead triceps extension form" },

  goblet:{ n:"Goblet Squat", uni:false, sets:3, lo:8, hi:12,
    setup:"Hold one dumbbell vertically against your chest, cupping the top end. Feet a bit wider than shoulders, toes slightly out.",
    focus:["Sit down between your heels rather than leaning forward.","Knees track out over your toes, not caving in.","Go as deep as you can with a flat back. The dumbbell at your chest acts as a counterweight."],
    miss:"Heels lifting. If they do, your ankles are limiting you — try a small plate or book under each heel.",
    vid:"goblet squat form" },

  rdl:{ n:"DB Romanian Deadlift", uni:false, sets:3, lo:8, hi:12,
    setup:"Stand holding a dumbbell in each hand in front of your thighs. Soft knees, not locked.",
    focus:["Push your hips backward, don't bend forward. The bar path stays close to your legs.","Stop when you feel a strong stretch in the hamstrings — usually around mid-shin.","Back stays flat the whole way. If it rounds, you've gone too far."],

    vid:"dumbbell romanian deadlift form" },

  bss:{ n:"Bulgarian Split Squat", uni:true, sets:3, lo:8, hi:12,
    setup:"Stand a couple of feet in front of the bench, rear foot laced up on it behind you. Dumbbells at your sides.",
    focus:["Most of your weight is on the front leg. The back leg is balance, not power.","Drop straight down. Front shin stays close to vertical.","Find your foot distance first with no weight — too close hits quads, too far hits glutes."],
    miss:"Standing too close to the bench, which jams the front knee. Move your front foot further forward.",
    vid:"bulgarian split squat form" },

  calf:{ n:"DB Calf Raise", uni:false, sets:3, lo:12, hi:20,
    setup:"Dumbbells at your sides, balls of your feet on a step or a couple of stacked books, heels hanging off.",
    focus:["Full stretch at the bottom, full squeeze at the top.","Pause a beat at the top of each rep.","Slow and controlled. Bouncing does nothing here."],
    miss:"Half reps at speed. Calves need range and time, not momentum.",
    vid:"dumbbell calf raise form" },

  pullup:{ n:"Pull-Ups", uni:false, sets:3, lo:1, hi:12, bw:true,
    setup:"Hang from the bar, hands roughly shoulder width. Palms forward for pull-ups, toward you for chin-ups (easier).",
    focus:["Start by pulling your shoulder blades down, before your arms bend.","Chest toward the bar, not chin over it.","Control the way down — that's where most of the growth is."],
    miss:"Kipping and half reps. If you can't do one yet, use a band for assistance or do slow negatives: jump to the top, lower for 5 seconds.",

    setup:"Seated with back support if your bench inclines to upright, or standing. Dumbbell at shoulder height, palm forward.",
    focus:["Press up and slightly back, finishing with the weight over your ear.","Don't let your ribs flare — brace your abs like you're about to be poked.","Stay square. The unloaded side wants to lean away."],
    miss:"Arching the lower back to get the weight up. Lighter weight, tighter core.",
    vid:"single arm dumbbell shoulder press form" },

  brow:{ n:"Bench-Supported DB Row", uni:true, sets:3, lo:10, hi:15,
    setup:"Set the bench to a 30–45° incline and lie chest-down on it, dumbbell hanging.",
    focus:["Chest stays on the bench the whole set — that's the point of this one.","Drive the elbow back and squeeze the shoulder blade.","Because you can't cheat with your back here, use lighter weight than a standing row."],
    miss:"Peeling your chest off the bench to move more weight. That defeats the exercise.",
    vid:"chest supported dumbbell row incline bench" },

    setup:"Standing, light dumbbells at your sides, slight bend in the elbows.",
    focus:["Lead with your elbows, not your hands.","Stop at shoulder height. Higher brings the traps in.","This is a light exercise. 10–15 lb is plenty and 20 is a lot."],
    miss:"Going too heavy and swinging. If you're using momentum, halve the weight.",
    vid:"dumbbell lateral raise form" },

  hammer:{ n:"Hammer Curl", uni:true, sets:2, extraRight:true, lo:10, hi:15,
    setup:"Standing, dumbbell held with palm facing your body, like holding a hammer.",
    focus:["Neutral grip throughout — don't rotate the wrist.","Elbow stays pinned at your side.","Lower slowly. Three seconds down."],
    miss:"Shrugging the shoulder to help at the top.",
    vid:"hammer curl form" },

  incline:{ n:"Incline DB Press", uni:false, sets:3, lo:8, hi:12,
    setup:"Bench at 30°. Dumbbells at chest height, palms forward.",
    focus:["30° is the sweet spot. Steeper turns it into a shoulder press.","Lower until you feel a stretch across the chest, then press.","Keep your shoulder blades pulled back and down against the bench."],
    miss:"Setting the bench too upright, which takes the chest out of it.",
    vid:"incline dumbbell press form" },

  csrow:{ n:"Chest-Supported Row", uni:false, sets:3, lo:10, hi:15,
    setup:"Bench at 30–45°, lying chest-down, a dumbbell in each hand.",
    focus:["Both arms together here — it's your one bilateral pull, so notice whether one side finishes first.","Squeeze the shoulder blades together at the top.","Chest stays down on the bench."],
    miss:"Letting the stronger side finish the rep first. If you notice it, drop the weight.",
    vid:"chest supported dumbbell row form" },

  rear:{ n:"Rear Delt Fly", uni:false, sets:3, lo:12, hi:20,
    setup:"Bench at 30°, chest down, or bent at the hips standing. Light dumbbells hanging, slight elbow bend.",
    focus:["Think of pulling your hands apart, not lifting them up.","Very light weight. 10 lb is often plenty.","Pause a beat at the top of every rep."],
    miss:"Going heavy and turning it into a row. If your elbows bend more as you go, it's too heavy.",
    vid:"rear delt fly dumbbell form" },

  icurl:{ n:"Incline DB Curl", uni:true, sets:2, extraRight:true, lo:10, hi:15,
    setup:"Bench at about 45°, lie back, arms hanging straight down behind your torso.",
    focus:["This is the one that hits the long head of the biceps hardest — relevant for you specifically.","Let the arm hang fully at the bottom. The stretch is the whole point.","Don't let your elbow drift forward as you curl."],
    miss:"Cutting the bottom of the range short. The stretched position is where this exercise earns its keep.",
    vid:"incline dumbbell curl form" },

  skull:{ n:"DB Skull Crusher", uni:false, sets:3, lo:10, hi:15,
    setup:"Lie flat, dumbbells held above your chest, palms facing each other.",
    focus:["Bend only at the elbow, lowering the weights beside your head.","Upper arms stay still, angled slightly back rather than straight up.","Control the lowering. This is a joint-sensitive movement — no bouncing."],
    miss:"Letting elbows flare wide. Keep them pointed forward.",
    vid:"dumbbell skull crusher form" }
};

const DAYS = [
  { id:"1", n:"Upper — Horizontal", ex:["obench","orow","pushup","curl","tri"] },
  { id:"2", n:"Lower",              ex:["goblet","rdl","bss","calf"] },
  { id:"3", n:"Upper — Vertical",   ex:["pullup","ohp","brow","lat","hammer"] },
  { id:"4", n:"Upper — Arms & Shoulders", ex:["incline","csrow","rear","icurl","skull"] }
];

/* ============================================================
   STATE
   ============================================================ */
let sessions = [];        // all logged sessions
let tab = "today";
let dayId = "1";
let draft = {};           // exerciseId -> [{side,weight,reps}]
let openInfo = {};
let authed = false;
let restEnd = 0;
let flash = null;

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0,10);

/* ============================================================
   AUTO-TARGET  — the deterministic rule, no guessing
   Look at the most recent session containing this exercise.
   If every set hit the top of the range -> +5 lb, back to bottom.
   Otherwise -> same weight, add a rep.
   For unilateral work the target is driven by the RIGHT side.
   ============================================================ */
function lastFor(exId){
  for(const s of sessions){                    // sessions sorted newest first
    if(s.entries && s.entries[exId] && s.entries[exId].length) return s.entries[exId];
  }
  return null;
}
function target(exId){
  const e = EX[exId], prev = lastFor(exId);
  if(!prev) return { weight:null, reps:e.lo, note:"First time — pick a weight you could do a couple more reps with." };

  const rel = e.uni ? prev.filter(s=>s.side==="R") : prev;
  if(!rel.length) return { weight:null, reps:e.lo, note:"No right-side data yet." };

  const w = Math.max(...rel.map(s=>Number(s.weight)||0));
  const atTop = rel.every(s=>Number(s.reps) >= e.hi);

  if(atTop){
    if(e.bw) return { weight:null, reps:e.hi+1,
      note:`All sets hit ${e.hi}. Keep adding reps, or slow the tempo to make them harder.` };
    return { weight:w+5, reps:e.lo, note:`Hit the top last time. Up 5 lb, back to ${e.lo} reps.` };
  }
  // Not every set reached the top yet — the job is to bring the lagging set up.
  const low = Math.min(...rel.map(s=>Number(s.reps)||0));
  return { weight: e.bw?null:w, reps:e.hi,
    note:`Your weakest set was ${low}. Get every set to ${e.hi} and the weight goes up.` };
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const el = document.getElementById("app");
  if(!authed){ el.innerHTML = renderLock(); document.getElementById("nav").innerHTML=""; return; }
  el.innerHTML =
      tab==="today"   ? renderToday()
    : tab==="progress"? renderProgress()
    : tab==="gap"     ? renderGap()
    :                   renderHistory();
  renderNav(); renderRest();
  flash = null;
}

function renderLock(){
  return `<div class="card" style="margin-top:70px">
    <h1>Lift</h1><p class="muted tiny">Enter your passcode.</p>
    <input id="pc" type="password" placeholder="Passcode" style="margin-bottom:10px"
      onkeydown="if(event.key==='Enter')unlock()">
    <button class="primary" style="width:100%" onclick="unlock()">Open</button></div>`;
}

function renderNav(){
  const items=[["today","Today","▲"],["progress","Progress","◆"],["gap","L/R Gap","◑"],["history","History","≡"]];
  document.getElementById("nav").innerHTML = items.map(([k,l,i])=>
    `<button class="${tab===k?"on":""}" onclick="go('${k}')">
      <span class="ic">${i}</span>${l}</button>`).join("");
}

function renderRest(){
  const box = document.getElementById("rest");
  const left = Math.ceil((restEnd-Date.now())/1000);
  if(left<=0){ box.innerHTML=""; return; }
  box.innerHTML = `<div class="rest"><span>Rest ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</span>
    <button class="sm" onclick="skipRest()">Skip</button></div>`;
}
setInterval(()=>{ if(authed && restEnd>Date.now()) renderRest();
  else if(authed && restEnd && restEnd<=Date.now()){ restEnd=0; renderRest(); } },1000);

function renderToday(){
  const day = DAYS.find(d=>d.id===dayId);
  const doneCount = day.ex.filter(x=>(draft[x]||[]).length).length;

  return `<div class="between" style="margin-bottom:12px">
      <div><h1>${esc(day.n)}</h1>
        <div class="tiny muted">${doneCount} of ${day.ex.length} exercises logged</div></div>
    </div>
    ${flash?`<div class="${flash.k}">${esc(flash.m)}</div>`:""}
    <div class="row" style="margin-bottom:14px">
      ${DAYS.map(d=>`<button class="sm ${d.id===dayId?"primary":"ghost"}"
        onclick="setDay('${d.id}')">Day ${d.id}</button>`).join("")}
    </div>
    ${day.ex.map(renderEx).join("")}
    ${doneCount ? `<button class="primary" style="width:100%;margin-top:6px"
        onclick="saveSession()">Finish &amp; save workout</button>` : ""}`;
}

function renderEx(exId){
  const e = EX[exId], t = target(exId), got = draft[exId]||[];
  const prev = lastFor(exId);
  const sides = e.uni ? ["R","L"] : ["-"];
  const nSets = s => (s==="R" && e.extraRight) ? e.sets+1 : e.sets;

  const prevTxt = prev
    ? (e.uni
        ? `Last: R ${prev.filter(s=>s.side==="R").map(s=>`${s.weight}×${s.reps}`).join(", ")}`
        : `Last: ${prev.map(s=>`${s.weight||"BW"}×${s.reps}`).join(", ")}`)
    : "No history yet";

  return `<div class="ex ${got.length?"done":""}">
    <div class="ex-hd">
      <div class="grow">
        <div class="ex-nm">${esc(e.n)}</div>
        <div class="tiny muted">${e.sets}${e.extraRight?"+1 right":""} × ${e.lo}–${e.hi}
          ${e.uni?`<span class="pill uni">Right leads</span>`:""}</div>
      </div>
      <button class="sm ghost" onclick="toggleInfo('${exId}')">${openInfo[exId]?"Hide":"How?"}</button>
    </div>

    ${openInfo[exId]?`<div class="info">
      <b>Setup.</b> ${esc(e.setup)}
      <b style="display:block;margin-top:10px">Focus on</b>
      <ul>${e.focus.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
      <b style="display:block;margin-top:10px">Most common mistake</b>
      ${esc(e.miss)}
      <a class="watch" target="_blank" rel="noopener"
        href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.vid)}">Watch a demo →</a>
    </div>`:""}

    <div class="target">
      <div><div class="tiny muted">${esc(prevTxt)}</div>
        <b>${t.weight!=null?t.weight+" lb × ":""}${t.reps} reps</b></div>
    </div>
    <div class="tiny muted" style="padding:0 14px 10px">${esc(t.note)}</div>

    ${sides.map(side=>`
      ${e.uni?`<div class="tiny muted" style="padding:6px 14px 0;font-weight:600">
        ${side==="R"?"Right (lead)":"Left — match the right"}</div>`:""}
      ${Array.from({length:nSets(side)},(_,i)=>{
        const done = got.find(g=>g.side===side && g.set===i);
        if(done) return `<div class="setrow"><span class="setlbl">Set ${i+1}</span>
          <span class="chip ${side==="R"?"r":side==="L"?"l":""}">${done.weight||"BW"} lb × ${done.reps}</span>
          <button class="sm ghost" onclick="undoSet('${exId}','${side}',${i})">Undo</button></div>`;
        return `<div class="setrow">
          <span class="setlbl">Set ${i+1}</span>
          ${e.bw?`<input type="hidden" id="w_${exId}_${side}_${i}" value="">`
                :`<input class="grow" id="w_${exId}_${side}_${i}" type="number" inputmode="decimal"
                    placeholder="lb" value="${t.weight!=null?t.weight:""}">`}
          <input class="grow" id="r_${exId}_${side}_${i}" type="number" inputmode="numeric"
            placeholder="reps" value="">
          <button class="sm primary" onclick="logSet('${exId}','${side}',${i})">Log</button>
        </div>`;
      }).join("")}
    `).join("")}
  </div>`;
}

function renderProgress(){
  const rows = Object.keys(EX).map(id=>{
    const hist = sessions.filter(s=>s.entries&&s.entries[id]).slice(0,8).reverse();
    if(!hist.length) return null;
    const top = h => { const r = EX[id].uni ? h.entries[id].filter(x=>x.side==="R") : h.entries[id];
      return Math.max(...r.map(x=>Number(x.weight)||0)); };
    const first = top(hist[0]), last = top(hist[hist.length-1]);
    return `<tr><td>${esc(EX[id].n)}</td>
      <td class="num mono">${first||"BW"}</td>
      <td class="num mono">${last||"BW"}</td>
      <td class="num mono" style="color:${last>first?"var(--good)":"var(--dim)"}">
        ${last>first?"+"+(last-first):"—"}</td></tr>`;
  }).filter(Boolean).join("");

  return `<h1>Progress</h1><p class="tiny muted">Working weight, first logged session to most recent.
    ${EX.obench.uni?"Unilateral lifts show the right side.":""}</p>
    <div class="card">${rows?`<table><thead><tr><th>Exercise</th>
      <th class="num">Start</th><th class="num">Now</th><th class="num">+</th></tr></thead>
      <tbody>${rows}</tbody></table>`:`<p class="muted">Log a few sessions and this fills in.</p>`}</div>`;
}

function renderGap(){
  const uni = Object.keys(EX).filter(id=>EX[id].uni);
  const rows = uni.map(id=>{
    const prev = lastFor(id); if(!prev) return null;
    const r = prev.filter(s=>s.side==="R"), l = prev.filter(s=>s.side==="L");
    if(!r.length||!l.length) return null;
    const vol = a => a.reduce((t,s)=>t+(Number(s.weight)||0)*(Number(s.reps)||0),0);
    const vr = vol(r), vl = vol(l);
    if(!vl) return null;
    const pct = Math.round(vr/vl*100);
    return `<div style="margin-bottom:14px">
      <div class="between"><span>${esc(EX[id].n)}</span>
        <span class="mono ${pct>=97?"":""}" style="color:${pct>=97?"var(--good)":"var(--acc)"}">${pct}%</span></div>
      <div class="bar"><i style="width:${Math.min(pct,100)}%"></i></div>
      <div class="tiny muted">Right is ${pct}% of left by volume this session</div></div>`;
  }).filter(Boolean).join("");

  return `<h1>Left / Right Gap</h1>
    <p class="tiny muted">Right-side volume as a share of left, from your most recent session on each lift.
      100% means even. This is the number to watch.</p>
    <div class="card">${rows||`<p class="muted">Log some unilateral work and this fills in.</p>`}</div>
    <div class="card"><h3>Reading this</h3>
      <p class="tiny muted" style="margin:0">Because you match your left to your right, these should sit near
        100% on rep count alone. A number well below 100 means you used more weight on the left —
        which is worth noticing, not panicking about. Narrowing over months is the goal, not a
        perfect score on any one day.</p></div>`;
}

function renderHistory(){
  if(!sessions.length) return `<h1>History</h1><div class="card muted">Nothing logged yet.</div>`;
  return `<h1>History</h1>` + sessions.slice(0,30).map(s=>{
    const day = DAYS.find(d=>d.id===s.day);
    const n = Object.keys(s.entries||{}).length;
    const vol = Object.values(s.entries||{}).flat()
      .reduce((t,x)=>t+(Number(x.weight)||0)*(Number(x.reps)||0),0);
    return `<div class="card"><div class="between">
      <div><b>${esc(day?day.n:"Day "+s.day)}</b>
        <div class="tiny muted">${esc(s.date)} · ${n} exercises · ${vol.toLocaleString()} lb volume</div></div>
      <button class="sm ghost" onclick="delSession('${s.id}')">Delete</button>
    </div></div>`;
  }).join("");
}

/* ============================================================
   ACTIONS
   ============================================================ */
window.go = k => { tab=k; render(); };
window.setDay = d => { dayId=d; draft={}; render(); };
window.toggleInfo = id => { openInfo[id]=!openInfo[id]; render(); };
window.skipRest = () => { restEnd=0; renderRest(); };

window.unlock = () => {
  const v = document.getElementById("pc").value;
  if(v !== PASSCODE){ alert("Wrong passcode"); return; }
  authed = true; localStorage.setItem("lift_ok","1"); start();
};

window.logSet = (exId, side, i) => {
  const e = EX[exId];
  const reps = document.getElementById(`r_${exId}_${side}_${i}`).value;
  if(!reps){ alert("Enter reps"); return; }
  const weight = e.bw ? 0 : document.getElementById(`w_${exId}_${side}_${i}`).value;
  if(!e.bw && !weight){ alert("Enter weight"); return; }
  draft[exId] = draft[exId]||[];
  draft[exId].push({ side, set:i, weight:Number(weight)||0, reps:Number(reps) });
  const isFirstTwo = DAYS.find(d=>d.id===dayId).ex.indexOf(exId) < 2;
  restEnd = Date.now() + (isFirstTwo?90:60)*1000;
  render();
};

window.undoSet = (exId, side, i) => {
  draft[exId] = (draft[exId]||[]).filter(g=>!(g.side===side&&g.set===i));
  if(!draft[exId].length) delete draft[exId];
  render();
};

window.saveSession = async () => {
  const id = `${today()}_${dayId}`;
  try{
    await setDoc(doc(db,"sessions",id), { date:today(), day:dayId, entries:draft,
      at:new Date().toISOString() });
    draft = {}; flash={k:"ok",m:"Workout saved."};
    restEnd=0; render();
  }catch(e){ flash={k:"err",m:"Save failed: "+e.message}; render(); }
};

window.delSession = async id => {
  if(!confirm("Delete this session?")) return;
  await deleteDoc(doc(db,"sessions",id)); render();
};

/* ============================================================
   BOOT
   ============================================================ */
function start(){
  onSnapshot(SESSIONS, s=>{
    sessions = s.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=> (b.date||"").localeCompare(a.date||""));
    render();
  }, err=>{
    document.getElementById("app").innerHTML =
      `<div class="card"><h2 style="color:var(--bad)">Can't reach the database</h2>
       <p class="tiny mono">${esc(err.message)}</p>
       <p class="tiny muted">Check the Firebase config and that the rules are published.</p></div>`;
  });
  render();
}

if(localStorage.getItem("lift_ok")==="1") authed = true;
if(authed) start(); else render();
</script>
</body>
</html>
