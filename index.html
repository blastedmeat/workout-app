<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Lift</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#141a23; --panel2:#1d252f; --line:#2b3542;
    --txt:#eef2f6; --dim:#8f9bab; --acc:#ff7a45; --acc2:#e8632c;
    --good:#3fb950; --bad:#f85149; --info:#58a6ff;
    --tap:52px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  h1{font-size:22px;margin:0 0 2px;letter-spacing:-.02em}
  h2{font-size:18px;margin:0 0 8px}
  h3{font-size:15px;margin:0 0 6px}
  .wrap{max-width:620px;margin:0 auto;padding:14px}
  .muted{color:var(--dim)} .tiny{font-size:13px} .mono{font-variant-numeric:tabular-nums}
  button{font:inherit;border:0;border-radius:12px;background:var(--panel2);color:var(--txt);
    padding:12px 16px;cursor:pointer;min-height:var(--tap)}
  button:active{transform:scale(.97)}
  button.primary{background:var(--acc);color:#1a0f08;font-weight:700}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
  button.sm{min-height:40px;padding:8px 12px;font-size:14px;border-radius:9px}
  input,select{font:inherit;background:#070b10;color:var(--txt);border:1px solid var(--line);
    border-radius:10px;padding:12px;width:100%;min-height:var(--tap)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .between{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}

  /* bottom nav */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
    background:rgba(10,14,20,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  .nav button{flex:1;background:transparent;color:var(--dim);font-size:12px;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;min-height:0}
  .nav button.on{color:var(--acc)}
  .nav .ic{font-size:20px;line-height:1}

  /* exercise block */
  .ex{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .ex.done{border-color:#1d4429}
  .ex-hd{padding:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ex-nm{font-weight:650;font-size:17px;letter-spacing:-.01em}
  .target{background:var(--panel2);border-radius:10px;padding:10px 12px;margin:0 14px 12px;
    display:flex;justify-content:space-between;align-items:center;gap:10px}
  .target b{font-size:19px;color:var(--acc)}
  .setrow{display:flex;gap:7px;align-items:center;padding:7px 14px}
  .setlbl{width:60px;font-size:13px;color:var(--dim);flex:none}
  .setrow input{padding:10px;text-align:center;font-size:17px;font-weight:600}
  .logged{padding:8px 14px 14px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--panel2);border-radius:8px;padding:5px 10px;font-size:13px;
    font-variant-numeric:tabular-nums}
  .chip.r{border-left:3px solid var(--acc)}
  .chip.l{border-left:3px solid var(--info)}
  .info{padding:0 14px 14px;font-size:14px;line-height:1.6;color:#cdd6e0;
    border-top:1px solid var(--line);margin-top:4px;padding-top:12px}
  .info b{color:var(--txt)}
  .info ul{margin:6px 0 0;padding-left:20px}
  .info li{margin-bottom:4px}
  .watch{display:inline-block;margin-top:10px;color:var(--info);text-decoration:none;
    border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;
    background:var(--panel2);color:var(--dim);font-weight:600;letter-spacing:.03em}
  .pill.uni{background:#2b1a10;color:var(--acc)}

  /* rest timer */
  .rest{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));
    z-index:40;background:var(--acc);color:#1a0f08;border-radius:14px;padding:12px 16px;
    display:flex;justify-content:space-between;align-items:center;font-weight:700;
    box-shadow:0 8px 28px rgba(0,0,0,.5)}
  .rest button{background:rgba(0,0,0,.18);color:#1a0f08;font-weight:700}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
  th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  td.num,th.num{text-align:right}
  .bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%;background:var(--acc)}
  .ok{background:#12261a;border:1px solid #1d4429;color:#56d364;padding:10px 12px;
    border-radius:10px;margin-bottom:10px;font-size:14px}
  .err{background:#341a1a;border:1px solid #5c2626;color:#ff9d95;padding:10px 12px;
    border-radius:10px;margin-bottom:10px;font-size:14px}
</style>
</head>

  { id:"3", n:"Upper — Vertical",   ex:["pullup","ohp","brow","fly","lat","hammer"] },
  { id:"4", n:"Upper — Arms & Shoulders", ex:["incline","pullover","csrow","rear","icurl","skull"] }
];
const DAYS_GAB = [
  { id:"A", n:"Jump & Squat",         ex:["snap","sqjump","pogo","goblet","rdl","dbbench","g_orow","deadbug"] },
  { id:"B", n:"Single Leg & Lateral", ex:["snap","latbound","stepup","g_bss","bridge","ohp2","extrot","sideplank"] },
  { id:"C", n:"Power",                ex:["snap","stepjump","broad","lunge","slrdl","pushup","csrow","g_rear"] }
];
const PROFILES = {
  dad:       { name:"Dad",       days:DAYS_DAD, gap:true },
  gabriella: { name:"Gabriella", days:DAYS_GAB, gap:false }
};
let profile = null;
try{ profile = localStorage.getItem("lift_profile"); }catch(e){}
if(!PROFILES[profile]) profile = null;
const days = () => PROFILES[profile||"dad"].days;

/* ============================================================
   STATE
   ============================================================ */
let allSessions = [];     // every logged session, both people
let sessions = [];        // the current person's sessions only
let tab = "today";
let dayId = "1";
let draft = {};           // exerciseId -> [{side,weight,reps}]
let openInfo = {};
let authed = false;
let restEnd = 0;
let flash = null;

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Local date. toISOString() is UTC, which stamped evening workouts with tomorrow's date.
const today = () => { const d=new Date(); const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };

/* ============================================================
   AUTO-TARGET  — the deterministic rule, no guessing
   Look at the most recent session containing this exercise.
   If every set hit the top of the range -> +5 lb, back to bottom.
   Otherwise -> same weight, add a rep.
   For unilateral work the target is driven by the RIGHT side.
   ============================================================ */
function lastFor(exId){
  for(const s of sessions){                    // sessions sorted newest first
    if(s.entries && s.entries[exId] && s.entries[exId].length) return s.entries[exId];
  }
  return null;
}
// Bowflex SelectTech 552: 2.5 lb steps from 5 to 25 lb, 5 lb steps from 25 to 55.
function nextWeight(w){ return w < 25 ? w + 2.5 : Math.min(w + 5, 55); }
function prevWeight(w){ return w <= 25 ? Math.max(5, w - 2.5) : w - 5; }
const fmtW = w => (Math.round(w*10)/10).toString();

// Which sides an exercise is logged on, and how many sets each.
//  - even: right and left, equal sets, no weak side
//  - uni:  weak (lead) side first, optional extra set on the right
//  - else: one combined side "-"
function sidesOf(e){
  if(e.uni && e.even) return ["R","L"];
  if(e.uni){ const lead=e.lead||"R"; return [lead, lead==="R"?"L":"R"]; }
  return ["-"];
}
function setsOn(e, side){
  if(e.uni && !e.even && side===(e.lead||"R") && e.extraRight) return e.sets+1;
  return e.sets;
}
const unitOf = e => e.unit==="sec" ? " sec" : "";

/* PROGRESSION — the target is a number you either hit or didn't.
   Replays every logged session for the exercise, oldest first:
   - New weight, or first time: target = bottom of the range.
   - Every prescribed set logged and at or above the target:
       target was the bottom -> next target is the top of the range.
   - Every prescribed set at the top of the range -> weight up one Bowflex
     step, target back to the bottom.
   - Anything else (a set short, a set skipped, mixed weights): same weight,
     same target. Nothing goes up.
   Changing the weight yourself counts as a new weight.
   Bodyweight lifts have no weight to add: as many clean reps as you can. */
function history(exId){
  return sessions
    .filter(s=>s.entries && s.entries[exId] && s.entries[exId].length)
    .slice()
    .sort((a,b)=>(a.date||"").localeCompare(b.date||"") || (a.at||"").localeCompare(b.at||""));
}

function target(exId){
  const e = EX[exId];
  const lead = e.lead || "R";
  // Sets that must all be logged before anything goes up.
  const need = e.uni && e.even ? e.sets*2 : setsOn(e, lead);

  if(e.fixed) return { weight:null,
    label:`${e.sets} × ${e.reps}${unitOf(e)}${e.per?" "+e.per:""}${e.even?" per side":""}`,
    note: e.cue || "Quality over quantity. Full effort on every rep, and stop the set if your form slips." };

  if(e.bw) return { weight:null, label:"As many clean reps as you can",
    note:"Stop each set while your form is still good. Try to beat last time on at least one set." };

  let st = null, why = "first";
  for(const s of history(exId)){
    const rel = (e.uni && !e.even) ? s.entries[exId].filter(x=>x.side===lead) : s.entries[exId];
    if(!rel.length) continue;

    const counts = {};
    rel.forEach(x=>{ const w=Number(x.weight)||0; counts[w]=(counts[w]||0)+1; });
    const w = Number(Object.keys(counts).sort((a,b)=>counts[b]-counts[a] || a-b)[0]);
    if(!st || w !== st.weight){ st = { weight:w, reps:e.lo }; }

    const reps = rel.map(x=>Number(x.reps)||0);
    const clean = rel.length >= need && rel.every(x=>(Number(x.weight)||0)===w);

    if(clean && reps.every(r=>r>=e.hi) && w < 55){
      const nw = nextWeight(w);
      why = `up:${fmtW(w)}`; st = { weight:nw, reps:e.lo };
    } else if(clean && reps.every(r=>r>=st.reps) && st.reps < e.hi){
      why = "hitLow"; st = { weight:w, reps:e.hi };
    } else {
      why = rel.length < need ? `skip:${rel.length}` : "miss";
    }
  }

  if(!st) return { weight:null, label:`${e.lo} reps`,
    note: profile==="gabriella"
      ? `First time. Start light — a weight you could lift 15 times — and do ${e.lo} perfect reps on every set.`
      : `First time. Pick a weight you can lift ${e.lo} times with good form, and do ${e.lo} on every set.` };

  const label = `${fmtW(st.weight)} lb × ${st.reps} reps`;
  let note;
  if(why.startsWith("up:"))     note = `Every set hit ${e.hi} at ${why.slice(3)} lb, so the weight goes up. Aim for ${e.lo} on every set.`;
  else if(why==="hitLow")       note = `Every set hit ${e.lo} last time. Now aim for ${e.hi} on every set.`;
  else if(why.startsWith("skip:")) note = `You logged ${why.slice(5)} of ${need} sets last time, so the target stays at ${st.reps}.`;
  else                          note = `Not every set reached ${st.reps} last time, so the target stays at ${st.reps}.`;
  return { weight:st.weight, label, note };
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const el = document.getElementById("app");
  if(!authed){ el.innerHTML = renderLock(); document.getElementById("nav").innerHTML=""; return; }
  if(!profile){ el.innerHTML = renderPicker(); document.getElementById("nav").innerHTML=""; return; }
  if(tab==="gap" && !PROFILES[profile].gap) tab = "today";
  el.innerHTML = `<div class="between" style="margin-bottom:10px">
      <span class="tiny muted">Training as <b style="color:var(--txt)">${esc(PROFILES[profile].name)}</b></span>
      <button class="sm ghost" onclick="switchProfile()">Switch</button></div>` + (
      tab==="today"   ? renderToday()
    : tab==="progress"? renderProgress()
    : tab==="gap"     ? renderGap()
    :                   renderHistory());
  renderNav(); renderRest();
  flash = null;
}

function renderLock(){
  return `<div class="card" style="margin-top:70px">
    <h1>Lift</h1><p class="muted tiny">Enter your passcode.</p>
    <input id="pc" type="password" placeholder="Passcode" style="margin-bottom:10px"
      onkeydown="if(event.key==='Enter')unlock()">
    <button class="primary" style="width:100%" onclick="unlock()">Open</button></div>`;
}

function renderPicker(){
  return `<div style="margin-top:70px"><h1>Who's training?</h1>
    <p class="muted tiny">You can switch any time from the top of the screen.</p>
    ${Object.entries(PROFILES).map(([k,p])=>`<button class="primary" style="width:100%;margin-top:12px;min-height:64px;font-size:19px"
      onclick="pickProfile('${k}')">${esc(p.name)}</button>`).join("")}</div>`;
}

function renderNav(){
  const items=[["today","Today","▲"],["progress","Progress","◆"],
    ...(PROFILES[profile].gap?[["gap","Gap Test","◑"]]:[]),["history","History","≡"]];
  document.getElementById("nav").innerHTML = items.map(([k,l,i])=>
    `<button class="${tab===k?"on":""}" onclick="go('${k}')">
      <span class="ic">${i}</span>${l}</button>`).join("");
}

function renderRest(){
  const box = document.getElementById("rest");
  const left = Math.ceil((restEnd-Date.now())/1000);
  if(left<=0){ box.innerHTML=""; return; }
  box.innerHTML = `<div class="rest"><span>Rest ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</span>
    <button class="sm" onclick="skipRest()">Skip</button></div>`;
}
setInterval(()=>{ if(authed && restEnd>Date.now()) renderRest();
  else if(authed && restEnd && restEnd<=Date.now()){ restEnd=0; renderRest(); } },1000);

function renderToday(){
  if(!days().some(d=>d.id===dayId)) dayId = days()[0].id;
  const day = days().find(d=>d.id===dayId);
  const doneCount = day.ex.filter(x=>(draft[x]||[]).length).length;

  return `<div class="between" style="margin-bottom:12px">
      <div><h1>${esc(day.n)}</h1>
        <div class="tiny muted">${doneCount} of ${day.ex.length} exercises logged</div></div>
    </div>
    ${flash?`<div class="${flash.k}">${esc(flash.m)}</div>`:""}
    <div class="row" style="margin-bottom:14px">
      ${days().map(d=>`<button class="sm ${d.id===dayId?"primary":"ghost"}"
        onclick="setDay('${d.id}')">Day ${d.id}</button>`).join("")}
    </div>
    ${day.ex.map(renderEx).join("")}
    ${doneCount ? `<button class="primary" style="width:100%;margin-top:6px"
        onclick="saveSession()">Finish &amp; save workout</button>` : ""}`;
}

function renderEx(exId){
  const e = EX[exId], t = target(exId), got = draft[exId]||[];
  const prev = lastFor(exId);
  const lead = e.lead || "R";
  const other = lead==="R" ? "L" : "R";
  const sides = sidesOf(e);
  const nSets = s => setsOn(e, s);
  const sideName = s => s==="R" ? "Right" : "Left";
  const one = x => Number(x.weight) ? `${fmtW(Number(x.weight))}×${x.reps}` : `${x.reps}${unitOf(e)}`;
  const lastSide = sd => prev.filter(s=>s.side===sd).sort((a,b)=>(a.set??0)-(b.set??0)).map(one).join(", ");

  const prevTxt = !prev ? "No history yet"
    : e.uni && e.even ? `Last: R ${lastSide("R")} · L ${lastSide("L")}`
    : e.uni           ? `Last: ${lead} ${lastSide(lead)}`
    :                   `Last: ${prev.map(one).join(", ")}`;
  const header = e.fixed
    ? `${e.sets} × ${e.reps}${unitOf(e)}${e.per?" "+e.per:""}${e.even?" per side":""}`
    : `${e.sets}${e.extraRight?"+1 right":""} × ${e.lo}–${e.hi}${e.even?" per side":""}`;

  return `<div class="ex ${got.length?"done":""}">
    <div class="ex-hd">
      <div class="grow">
        <div class="ex-nm">${esc(e.n)}</div>
        <div class="tiny muted">${header}
          ${e.uni&&!e.even?`<span class="pill uni">${sideName(lead)} leads</span>`:""}</div>
      </div>
      <button class="sm ghost" onclick="toggleInfo('${exId}')">${openInfo[exId]?"Hide":"How?"}</button>
    </div>

    ${openInfo[exId]?`<div class="info">
      <b>Setup.</b> ${esc(e.setup)}
      <b style="display:block;margin-top:10px">Focus on</b>
      <ul>${e.focus.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
      <b style="display:block;margin-top:10px">Most common mistake</b>
      ${esc(e.miss)}
      <a class="watch" target="_blank" rel="noopener"
        href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.vid)}">Watch a demo →</a>
    </div>`:""}

    <div class="target">
      <div><div class="tiny muted">${esc(prevTxt)}</div>
        <b>${esc(t.label)}</b></div>
    </div>
    <div class="tiny muted" style="padding:0 14px 10px">${esc(t.note)}</div>

    ${sides.map(side=>`
      ${e.uni?`<div class="tiny muted" style="padding:6px 14px 0;font-weight:600">
        ${e.even ? sideName(side)
         : side===lead?`${sideName(side)} (lead — weaker side)`
                      :`${sideName(side)} — match the ${sideName(lead).toLowerCase()}`}</div>`:""}
      ${Array.from({length:nSets(side)},(_,i)=>{
        const done = got.find(g=>g.side===side && g.set===i);
        if(done) return `<div class="setrow"><span class="setlbl">Set ${i+1}</span>
          <span class="chip ${side==="-"?"":side===lead?"r":"l"}">${
            Number(done.weight)?`${fmtW(Number(done.weight))} lb × ${done.reps}`:`${done.reps}${unitOf(e)}`}</span>
          <button class="sm ghost" onclick="undoSet('${exId}','${side}',${i})">Undo</button></div>`;
        return `<div class="setrow">
          <span class="setlbl">Set ${i+1}</span>
          ${e.bw||e.fixed?`<input type="hidden" id="w_${exId}_${side}_${i}" value="">`
                :`<input class="grow" id="w_${exId}_${side}_${i}" type="number" inputmode="decimal"
                    placeholder="lb" value="${t.weight!=null?t.weight:""}">`}
          <input class="grow" id="r_${exId}_${side}_${i}" type="number" inputmode="numeric"
            placeholder="${e.unit==="sec"?"sec":"reps"}" value="${e.fixed?e.reps:""}">
          <button class="sm primary" onclick="logSet('${exId}','${side}',${i})">Log</button>
        </div>`;
      }).join("")}
    `).join("")}
  </div>`;
}

function renderProgress(){
  const rows = Object.keys(EX).filter(id=>!EX[id].fixed && !EX[id].bw).map(id=>{
    const hist = sessions.filter(s=>s.entries&&s.entries[id]).slice(0,8).reverse();
    if(!hist.length) return null;
    const top = h => { const r = EX[id].uni && !EX[id].even ? h.entries[id].filter(x=>x.side===(EX[id].lead||"R")) : h.entries[id];
      return Math.max(...r.map(x=>Number(x.weight)||0)); };
    const first = top(hist[0]), last = top(hist[hist.length-1]);
    return `<tr><td>${esc(EX[id].n)}</td>
      <td class="num mono">${first||"BW"}</td>
      <td class="num mono">${last||"BW"}</td>
      <td class="num mono" style="color:${last>first?"var(--good)":"var(--dim)"}">
        ${last>first?"+"+(last-first):"—"}</td></tr>`;
  }).filter(Boolean).join("");

  return `<h1>Progress</h1><p class="tiny muted">Working weight, first logged session to most recent.
    ${PROFILES[profile].gap?"Unilateral lifts show the lead (weaker) side.":""}</p>
    <div class="card">${rows?`<table><thead><tr><th>Exercise</th>
      <th class="num">Start</th><th class="num">Now</th><th class="num">+</th></tr></thead>
      <tbody>${rows}</tbody></table>`:`<p class="muted">Log a few sessions and this fills in.</p>`}</div>`;
}

/* ============================================================
   GAP TEST
   Training deliberately hides the gap: same weight both sides, strong side
   matched to the weak one. So the gap is measured separately, every 4–6
   weeks: same weight, each side to technical failure, count the reps.
   Tests are stored in the sessions collection with day:"gap" and an empty
   entries map, which keeps them out of the auto-target and progress math
   and needs no rules change.
   ============================================================ */
const GAP_SUGGEST = ["obench","curl"];   // right pec, right biceps
let gapEx = "obench";

const gapTests = () => sessions.filter(s=>s.day==="gap" && s.gap)
  .sort((a,b)=>(a.date||"").localeCompare(b.date||""));

function renderGap(){
  const uni = [...new Set(DAYS_DAD.flatMap(d=>d.ex))].filter(id=>EX[id].uni && !EX[id].even);
  const nm = s => s==="R" ? "Right" : "Left";
  const e = EX[gapEx], lead = e.lead||"R", other = lead==="R"?"L":"R";
  const prevForEx = gapTests().filter(t=>t.gap.ex===gapEx);
  const lastW = prevForEx.length ? prevForEx[prevForEx.length-1].gap.weight : "";

  const all = gapTests();
  const last = all.length ? all[all.length-1].date : null;
  const days = last ? Math.round((new Date(today())-new Date(last))/86400000) : null;

  const results = uni.map(id=>{
    const ts = all.filter(t=>t.gap.ex===id);
    if(!ts.length) return "";
    const L = EX[id].lead||"R";
    const rows = ts.map((t,i)=>{
      const g = t.gap, pct = g.strong ? Math.round(g.weak/g.strong*100) : 0;
      const prevW = i ? ts[i-1].gap.weight : g.weight;
      return `<tr><td class="tiny">${esc(t.date)}</td>
        <td class="num mono">${g.weight}${g.weight!==prevW?' <span class="pill">new wt</span>':""}</td>
        <td class="num mono">${g.weak}</td><td class="num mono">${g.strong}</td>
        <td class="num mono" style="color:${pct>=95?"var(--good)":"var(--acc)"}">${pct}%</td>
        <td><button class="sm ghost" onclick="delSession('${t.id}')">✕</button></td></tr>`;
    }).join("");
    let trend = "";
    if(ts.length>1){
      const a=ts[0].gap, b=ts[ts.length-1].gap;
      if(a.weight===b.weight){
        const d=(b.strong-b.weak)-(a.strong-a.weak);
        trend = d<0 ? `Gap narrowed by ${-d} rep${-d===1?"":"s"} since your first test.`
              : d>0 ? `Gap widened by ${d} rep${d===1?"":"s"} since your first test.`
              : `Gap unchanged since your first test.`;
      } else trend = "Weight changed between first and latest test, so compare the percentages, not raw reps.";
    }
    return `<div class="card"><h3>${esc(EX[id].n)}</h3>
      <table><thead><tr><th>Date</th><th class="num">lb</th>
        <th class="num">${nm(L)}</th><th class="num">${nm(L==="R"?"L":"R")}</th>
        <th class="num">Weak %</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      ${trend?`<p class="tiny muted" style="margin:10px 0 0">${trend}</p>`:""}</div>`;
  }).join("");

  return `<h1>Gap Test</h1>
    <p class="tiny muted">Training hides the gap on purpose, so measure it separately every 4–6 weeks.
      ${days==null?"No tests yet.":`Last test ${days} day${days===1?"":"s"} ago.`}</p>
    ${flash?`<div class="${flash.k}">${esc(flash.m)}</div>`:""}
    <div class="card">
      <h3>Log a test</h3>
      <select onchange="setGapEx(this.value)" style="margin-bottom:10px">
        ${uni.map(id=>`<option value="${id}" ${id===gapEx?"selected":""}>${esc(EX[id].n)}${
          GAP_SUGGEST.includes(id)?" ★":""}</option>`).join("")}
      </select>
      <input id="gw" type="number" inputmode="decimal" placeholder="Weight per dumbbell (lb)"
        value="${lastW}" style="margin-bottom:8px">
      <div class="row" style="flex-wrap:nowrap">
        <input id="gweak" class="grow" type="number" inputmode="numeric" placeholder="${nm(lead)} reps">
        <input id="gstrong" class="grow" type="number" inputmode="numeric" placeholder="${nm(other)} reps">
      </div>
      <button class="primary" style="width:100%;margin-top:10px" onclick="saveGap()">Save test</button>
      <div class="info" style="margin-top:12px">
        <b>How to run it</b>
        <ul>
          <li>${nm(lead)} side first, while fresh. Rest 2–3 minutes, then the ${nm(other).toLowerCase()}.</li>
          <li>Pick a weight your weak side can do about 8–12 times, and <b>use the same weight every test</b> —
            otherwise the numbers don't compare.${lastW?` Last time you used ${lastW} lb.`:""}</li>
          <li>Go to technical failure: stop at the last rep you can do with clean form. No grinding.</li>
          <li>Do it at the start of a session, before that lift's normal sets.</li>
          <li>★ marks the two worth testing for you: right pec and right biceps.</li>
        </ul>
      </div>
    </div>
    ${results}`;
}

window.setGapEx = v => { gapEx = v; render(); };

window.saveGap = async () => {
  const w = Number(document.getElementById("gw").value);
  const weak = Number(document.getElementById("gweak").value);
  const strong = Number(document.getElementById("gstrong").value);
  if(!w || !weak || !strong){ flash={k:"err",m:"Enter the weight and both rep counts."}; render(); return; }
  try{
    await setDoc(doc(db,"sessions",`${today()}_gap_${gapEx}`),
      { date:today(), day:"gap", user:"dad", entries:{},
        gap:{ ex:gapEx, weight:w, weak, strong, weakSide:EX[gapEx].lead||"R" },
        at:new Date().toISOString() });
    flash={k:"ok",m:"Test saved."};
  }catch(e){ flash={k:"err",m:"Save failed: "+e.message}; }
  render();
};

let openSession = null;

function fmtDate(iso){
  const [y,m,d] = String(iso||"").split("-").map(Number);
  if(!y) return iso||"";
  return new Date(y,m-1,d).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}

function renderSessionDetail(s){
  const day = days().find(d=>d.id===s.day);
  const ids = Object.keys(s.entries||{});
  // Today's day order first, then anything that's since moved to another day.
  const order = [...(day?day.ex:[]).filter(id=>ids.includes(id)), ...ids.filter(id=>!(day&&day.ex.includes(id)))];
  const sideName = sd => sd==="R" ? "Right" : sd==="L" ? "Left" : "";
  return order.map(id=>{
    const e = EX[id] || { n:id };
    const sets = s.entries[id] || [];
    const lead = e.lead || "R";
    const sides = e.uni ? sidesOf(e) : [...new Set(sets.map(x=>x.side))];
    const rows = sides.map(sd=>{
      const ss = sets.filter(x=>x.side===sd).sort((a,b)=>(a.set??0)-(b.set??0));
      if(!ss.length) return "";
      return `<div style="display:flex;gap:6px;margin-top:6px;align-items:flex-start">
        ${e.uni?`<span class="tiny muted" style="width:42px;flex:none;padding-top:5px">${sideName(sd)}</span>`:""}
        <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${ss.map(x=>`<span class="chip ${e.uni?(sd===lead?"r":"l"):""}">${
          e.bw||!Number(x.weight) ? "" : fmtW(Number(x.weight))+" lb × "}${x.reps}${Number(x.weight)?"":unitOf(e)}</span>`).join("")}
        </div>
      </div>`;
    }).join("");
    return `<div style="padding:10px 0;border-top:1px solid var(--line)">
      <div style="font-weight:600;font-size:15px">${esc(e.n)}</div>${rows}</div>`;
  }).join("");
}

function renderHistory(){
  const ws = sessions.filter(s=>s.day!=="gap");
  if(!ws.length) return `<h1>History</h1><div class="card muted">Nothing logged yet.</div>`;
  return `<h1>History</h1><p class="tiny muted">Tap a workout to see every set.</p>` + ws.map(s=>{
    const day = days().find(d=>d.id===s.day);
    const n = Object.keys(s.entries||{}).length;
    const vol = Object.values(s.entries||{}).flat()
      .reduce((t,x)=>t+(Number(x.weight)||0)*(Number(x.reps)||0),0);
    const open = openSession===s.id;
    return `<div class="card" style="cursor:pointer" onclick="toggleSession('${s.id}')">
      <div class="between">
        <div><b>${esc(day?day.n:"Day "+s.day)}</b>
          <div class="tiny muted">${esc(fmtDate(s.date))} · ${n} exercise${n===1?"":"s"} · ${vol.toLocaleString()} lb volume</div></div>
        <span class="muted" style="font-size:18px">${open?"▾":"▸"}</span>
      </div>
      ${open?`<div style="margin-top:10px" onclick="event.stopPropagation()">
        ${renderSessionDetail(s)}
        <button class="sm ghost" style="margin-top:12px" onclick="delSession('${s.id}')">Delete this workout</button>
      </div>`:""}
    </div>`;
  }).join("");
}

window.toggleSession = id => { openSession = openSession===id ? null : id; render(); };

/* ============================================================
   ACTIONS
   ============================================================ */
/* In-progress workouts live on the device, not in memory and not in Firestore.
   A phone locking between sets used to wipe everything logged so far. This also
   means a workout survives losing signal — nothing needs the network until you
   press Finish. */
// Dad keeps the original key so an in-progress workout survives this update.
const draftKey = () => profile==="dad" || !profile ? "lift_draft" : "lift_draft_"+profile;

function saveDraft(){
  try{
    if(!Object.keys(draft).length){ localStorage.removeItem(draftKey()); return; }
    localStorage.setItem(draftKey(), JSON.stringify({ date:today(), day:dayId, draft }));
  }catch(e){ /* private mode or full storage — the workout still runs, just isn't recoverable */ }
}

function loadDraft(){
  try{
    const raw = localStorage.getItem(draftKey());
    if(!raw) return;
    const d = JSON.parse(raw);
    // Only restore today's workout. Yesterday's half-finished session shouldn't
    // reappear and get saved onto today's date.
    if(d.date !== today()){ localStorage.removeItem(draftKey()); return; }
    draft = d.draft || {};
    dayId = d.day || dayId;
  }catch(e){ localStorage.removeItem(draftKey()); }
}

function useProfile(k){
  profile = k;
  try{ localStorage.setItem("lift_profile", k); }catch(e){}
  sessions = allSessions.filter(s=>(s.user||"dad")===profile);
  draft = {}; restEnd = 0; openInfo = {}; openSession = null; tab = "today";
  dayId = days()[0].id;
  loadDraft();
  render();
}
window.pickProfile = k => useProfile(k);
window.switchProfile = () => {
  if(Object.keys(draft).length) saveDraft();   // kept on the phone, comes back when you switch back
  profile = null; render();
};

window.go = k => { tab=k; render(); };
window.setDay = d => {
  if(d!==dayId && Object.keys(draft).length &&
     !confirm("You have sets logged that aren't saved. Switching days will discard them. Continue?")) return;
  dayId=d; draft={}; saveDraft(); render();
};
window.toggleInfo = id => { openInfo[id]=!openInfo[id]; render(); };
window.skipRest = () => { restEnd=0; renderRest(); };

window.unlock = () => {
  const v = document.getElementById("pc").value;
  if(v !== PASSCODE){ alert("Wrong passcode"); return; }
  authed = true; localStorage.setItem("lift_ok","1"); start();
};

// True once every set of every exercise in today's day has been logged.
// Without this the timer starts after the final set and counts down at you
// while you're putting the dumbbells away.
function dayDone(){
  const day = days().find(d=>d.id===dayId);
  if(!day) return false;
  return day.ex.every(id=>{
    const e = EX[id];
    const got = draft[id]||[];
    return sidesOf(e).every(sd=>{
      for(let k=0;k<setsOn(e,sd);k++) if(!got.some(g=>g.side===sd && g.set===k)) return false;
      return true;
    });
  });
}

window.logSet = (exId, side, i) => {
  const e = EX[exId];
  const reps = document.getElementById(`r_${exId}_${side}_${i}`).value;
  if(!reps){ alert("Enter reps"); return; }
  const weight = (e.bw||e.fixed) ? 0 : document.getElementById(`w_${exId}_${side}_${i}`).value;
  if(!e.bw && !e.fixed && !weight){ alert("Enter weight"); return; }
  draft[exId] = draft[exId]||[];
  draft[exId].push({ side, set:i, weight:Number(weight)||0, reps:Number(reps) });
  const isFirstTwo = days().find(d=>d.id===dayId).ex.indexOf(exId) < 2;
  const rest = e.rest ?? (isFirstTwo?90:60);
  restEnd = dayDone() ? 0 : Date.now() + rest*1000;
  saveDraft();
  render();
};

window.undoSet = (exId, side, i) => {
  draft[exId] = (draft[exId]||[]).filter(g=>!(g.side===side&&g.set===i));
  if(!draft[exId].length) delete draft[exId];
  saveDraft();
  render();
};

window.saveSession = async () => {
  // Dad's ids keep their original shape so a second save the same day overwrites, not duplicates.
  const id = profile==="dad" ? `${today()}_${dayId}` : `${today()}_${profile}_${dayId}`;
  try{
    await setDoc(doc(db,"sessions",id), { date:today(), day:dayId, user:profile, entries:draft,
      at:new Date().toISOString() });
    draft = {}; saveDraft();
    flash={k:"ok",m:"Workout saved."};
    restEnd=0; render();
  }catch(e){ flash={k:"err",m:"Save failed: "+e.message}; render(); }
};

window.delSession = async id => {
  if(!confirm("Delete this session?")) return;
  await deleteDoc(doc(db,"sessions",id)); render();
};

/* ============================================================
   BOOT
   ============================================================ */
function start(){
  onSnapshot(SESSIONS, s=>{
    allSessions = s.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=> (b.date||"").localeCompare(a.date||""));
    sessions = allSessions.filter(x=>(x.user||"dad")===(profile||"dad"));
    render();
  }, err=>{
    document.getElementById("app").innerHTML =
      `<div class="card"><h2 style="color:var(--bad)">Can't reach the database</h2>
       <p class="tiny mono">${esc(err.message)}</p>
       <p class="tiny muted">Check the Firebase config and that the rules are published.</p></div>`;
  });
  render();
}

if(profile){ dayId = days()[0].id; loadDraft(); }
if(localStorage.getItem("lift_ok")==="1") authed = true;
if(authed) start(); else render();
</script>
</body>
</html>
